# NorBot production Nginx — TLS terminates on the VDS host.
# Upstream containers publish only on loopback (see compose.production.yml).
# Install to /etc/nginx/sites-available/norbot.conf and enable.
# Certbot manages the ssl_certificate lines after the HTTP challenge.

upstream norbot_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream norbot_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Apex → www
server {
    listen 80;
    listen [::]:80;
    server_name norbot.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.norbot.io$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.norbot.io api.norbot.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.norbot.io;

    # ssl_certificate /etc/letsencrypt/live/www.norbot.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.norbot.io/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://norbot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.norbot.io;

    # ssl_certificate /etc/letsencrypt/live/api.norbot.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.norbot.io/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://norbot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
