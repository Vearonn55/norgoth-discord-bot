# NorBot staging Nginx — test.norbot.io + api.test.norbot.io
# Test stack publishes on loopback 3001/8001 to coexist with prod on the same VDS.

limit_req_zone $binary_remote_addr zone=norbot_test_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=norbot_test_api:10m rate=10r/s;

upstream norbot_test_web {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream norbot_test_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.norbot.io api.test.norbot.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.norbot.io;

    # ssl_certificate /etc/letsencrypt/live/test.norbot.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/test.norbot.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 20m;

    location / {
        limit_req zone=norbot_test_web burst=60 nodelay;
        proxy_pass http://norbot_test_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.test.norbot.io;

    # ssl_certificate /etc/letsencrypt/live/api.test.norbot.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.test.norbot.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 20m;

    location ^~ /internal/ {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=norbot_test_api burst=40 nodelay;
        proxy_pass http://norbot_test_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
