# Production overlay. Source of truth is git — deploy syncs this to
# /opt/norbot/deploy/. Do not edit it on the VDS.
name: norbot-prod

services:
  postgres:
    environment:
      POSTGRES_DB: norbot_prod

  api:
    image: ${NORBOT_API_IMAGE:?}:${NORBOT_IMAGE_TAG:?}
    env_file:
      - /opt/norbot/env/production.env
    environment:
      NORGOTH_ENVIRONMENT: production
      NORGOTH_AUTH_ENFORCED: "true"
      NORGOTH_ENABLE_DOCS: "false"
      NORGOTH_CAMPAIGN_PG_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"

  campaign-worker:
    image: ${NORBOT_API_IMAGE:?}:${NORBOT_IMAGE_TAG:?}
    command: ["python", "-m", "app.workers.campaign_worker"]
    env_file:
      - /opt/norbot/env/production.env
    environment:
      NORGOTH_ENVIRONMENT: production
      NORGOTH_CAMPAIGN_PG_ENABLED: "true"
      NORGOTH_CAMPAIGN_REHYDRATE_ON_START: "true"

  content-worker:
    image: ${NORBOT_API_IMAGE:?}:${NORBOT_IMAGE_TAG:?}
    command: ["python", "-m", "app.workers.content_notification_worker"]
    env_file:
      - /opt/norbot/env/production.env
    environment:
      NORGOTH_ENVIRONMENT: production

  bot:
    image: ${NORBOT_BOT_IMAGE:?}:${NORBOT_IMAGE_TAG:?}
    env_file:
      - /opt/norbot/env/production.env

  web:
    image: ${NORBOT_WEB_IMAGE:?}:${NORBOT_IMAGE_TAG:?}
    env_file:
      - /opt/norbot/env/production.env
    ports:
      - "127.0.0.1:3000:3000"
