name: Rehydrate test DB

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 04:00 UTC
    - cron: "0 4 * * 0"

permissions:
  contents: read

concurrency:
  group: rehydrate-test-db
  cancel-in-progress: false

jobs:
  rehydrate:
    name: Guarded prod → test refresh
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve VDS SSH target
        id: vds
        uses: ./.github/actions/vds-ssh-target
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Run rehydrate on VDS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ steps.vds.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            export CONFIRM_REHYDRATE=norbot_test
            export NORBOT_IMAGE_TAG="$(grep '^SHA=' /opt/norbot/releases/CURRENT | cut -d= -f2)"
            export NORBOT_API_IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/norbot-api"
            /opt/norbot/scripts/rehydrate-test-db.sh
