name: CI

on:
  pull_request:
  push:
    branches: [main, test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard lint/test/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Norgoth/apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Norgoth/apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NORGOTH_API_INTERNAL_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_DASHBOARD_URL: http://127.0.0.1:3000

  api:
    name: API pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Norgoth/apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norbot
          POSTGRES_PASSWORD: norbot
          POSTGRES_DB: norbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norbot -d norbot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Norgoth/apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
        env:
          NORGOTH_DATABASE_URL: postgresql+psycopg://norbot:norbot@127.0.0.1:5432/norbot_ci
      - run: python -m pytest -q
        env:
          NORGOTH_ENVIRONMENT: testing
          NORGOTH_DATABASE_URL: postgresql+psycopg://norbot:norbot@127.0.0.1:5432/norbot_ci
          NORGOTH_REDIS_URL: redis://127.0.0.1:6379/0

  bot:
    name: Bot pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Norgoth/apps/bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Norgoth/apps/bot/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: Norgoth/deploy/docker/Dockerfile.api
            context: Norgoth/apps/api
            ignore: Norgoth/deploy/docker/.dockerignore.api
          - name: bot
            file: Norgoth/deploy/docker/Dockerfile.bot
            context: Norgoth/apps/bot
            ignore: Norgoth/deploy/docker/.dockerignore.bot
          - name: web
            file: Norgoth/deploy/docker/Dockerfile.web
            context: Norgoth/apps/dashboard
            ignore: Norgoth/deploy/docker/.dockerignore.web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare dockerignore
        run: cp "${{ matrix.ignore }}" "${{ matrix.context }}/.dockerignore"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: norbot-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
