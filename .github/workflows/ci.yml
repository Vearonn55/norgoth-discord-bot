name: CI

on:
  pull_request:
  push:
    branches: [main, test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard lint/test/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Norgoth/apps/dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Norgoth/apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NORGOTH_API_INTERNAL_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_DASHBOARD_URL: http://127.0.0.1:3000

  api:
    name: API pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Norgoth/apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norbot
          POSTGRES_PASSWORD: norbot
          POSTGRES_DB: norbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norbot -d norbot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Norgoth/apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
        env:
          NORGOTH_DATABASE_URL: postgresql+psycopg://norbot:norbot@127.0.0.1:5432/norbot_ci
      - run: python -m pytest -q
        env:
          NORGOTH_ENVIRONMENT: testing
          NORGOTH_DATABASE_URL: postgresql+psycopg://norbot:norbot@127.0.0.1:5432/norbot_ci
          NORGOTH_REDIS_URL: redis://127.0.0.1:6379/0

  bot:
    name: Bot pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Norgoth/apps/bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Norgoth/apps/bot/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Command manifest snapshot
        run: |
          python -c "import json; from bot.commands.registry import manifest_snapshot; expected=json.load(open('tests/command_manifest.snapshot.json',encoding='utf-8')); actual=manifest_snapshot(); assert actual==expected, 'command manifest drifted — update tests/command_manifest.snapshot.json'"
          python scripts/export_command_docs.py
          git diff --exit-code -- ../../docs/commands.md || (echo 'docs/commands.md out of date; re-run export_command_docs.py' && exit 1)

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Norgoth/apps/dashboard/package-lock.json
      - name: pip-audit (API + bot)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r Norgoth/apps/api/requirements.txt
          pip-audit -r Norgoth/apps/bot/requirements.txt
      - name: npm audit (production deps, critical)
        working-directory: Norgoth/apps/dashboard
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Prepare dockerignores
        run: |
          cp Norgoth/deploy/docker/.dockerignore.api Norgoth/apps/api/.dockerignore
          cp Norgoth/deploy/docker/.dockerignore.bot Norgoth/apps/bot/.dockerignore
          cp Norgoth/deploy/docker/.dockerignore.web Norgoth/apps/dashboard/.dockerignore
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: Norgoth/apps/api
          file: Norgoth/deploy/docker/Dockerfile.api
          push: false
          load: true
          tags: norbot-api:ci
          cache-from: type=gha,scope=norbot-api
          cache-to: type=gha,mode=max,scope=norbot-api
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: norbot-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          scanners: vuln
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: Norgoth/apps/bot
          file: Norgoth/deploy/docker/Dockerfile.bot
          push: false
          load: true
          tags: norbot-bot:ci
          cache-from: type=gha,scope=norbot-bot
          cache-to: type=gha,mode=max,scope=norbot-bot
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: norbot-bot:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          scanners: vuln
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: Norgoth/apps/dashboard
          file: Norgoth/deploy/docker/Dockerfile.web
          push: false
          load: true
          tags: norbot-web:ci
          cache-from: type=gha,scope=norbot-web
          cache-to: type=gha,mode=max,scope=norbot-web
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: norbot-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          # Node official images ship a full npm/yarn tree that is not on the
          # NorBot runtime path (standalone `node server.js`). Skip it so CI
          # fails on app/OS findings only, not CVE-2026-59873 in image npm.
          skip-dirs: usr/local/lib/node_modules/npm,opt/yarn-v1.22.22
          scanners: vuln
