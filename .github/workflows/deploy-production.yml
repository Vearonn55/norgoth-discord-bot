name: Deploy production
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Backup, migrate, deploy, smoke
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify deploy transport
        id: deploy
        uses: ./.github/actions/vds-deploy-preflight
        with:
          apply_secret: ${{ secrets.DEPLOY_APPLY_SECRET }}
          force_ssh: ${{ vars.NORBOT_FORCE_SSH_DEPLOY }}
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image namespace
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build and push images
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cp Norgoth/deploy/docker/.dockerignore.api Norgoth/apps/api/.dockerignore
          cp Norgoth/deploy/docker/.dockerignore.bot Norgoth/apps/bot/.dockerignore
          cp Norgoth/deploy/docker/.dockerignore.web Norgoth/apps/dashboard/.dockerignore
          docker build -f Norgoth/deploy/docker/Dockerfile.api -t "ghcr.io/${OWNER}/norbot-api:${TAG}" Norgoth/apps/api
          docker build -f Norgoth/deploy/docker/Dockerfile.bot -t "ghcr.io/${OWNER}/norbot-bot:${TAG}" Norgoth/apps/bot
          docker build -f Norgoth/deploy/docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_DASHBOARD_URL=https://www.norbot.io \
            --build-arg NORGOTH_API_INTERNAL_URL=http://api:8000 \
            -t "ghcr.io/${OWNER}/norbot-web:${TAG}" Norgoth/apps/dashboard
          bash .github/scripts/docker-push-retry.sh \
            "ghcr.io/${OWNER}/norbot-api:${TAG}" \
            "ghcr.io/${OWNER}/norbot-bot:${TAG}" \
            "ghcr.io/${OWNER}/norbot-web:${TAG}"
      - name: Deploy over HTTPS
        if: steps.deploy.outputs.transport == 'https'
        uses: ./.github/actions/vds-https-apply
        with:
          url: ${{ secrets.DEPLOY_APPLY_URL }}
          secret: ${{ secrets.DEPLOY_APPLY_SECRET }}
          env_name: production
          sha: ${{ github.sha }}
          owner: ${{ steps.meta.outputs.owner }}
          ghcr_user: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve VDS SSH target
        id: vds
        if: steps.deploy.outputs.transport == 'ssh'
        continue-on-error: true
        uses: ./.github/actions/vds-ssh-target
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          retries: "2"
          connect_timeout: "8"
      - name: Prepare VDS staging directory
        if: steps.vds.outcome == 'success'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ steps.vds.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 60s
          script: mkdir -p "/var/tmp/norbot-git-${{ github.run_id }}"
      - name: Sync compose and scripts to VDS
        if: steps.vds.outcome == 'success'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ steps.vds.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 60s
          source: "Norgoth/deploy,Norgoth/scripts/docker,Norgoth/scripts/vds"
          target: "/var/tmp/norbot-git-${{ github.run_id }}"
          rm: false
          overwrite: true
      - name: Deploy over SSH
        if: steps.vds.outcome == 'success'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PULL_USER: ${{ github.actor }}
        with:
          host: ${{ steps.vds.outputs.ip }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 60s
          command_timeout: 20m
          envs: GHCR_PULL_TOKEN,GHCR_PULL_USER
          script: |
            set -euo pipefail
            trap 'rm -rf "/var/tmp/norbot-git-${{ github.run_id }}"' EXIT
            export NORBOT_IMAGE_OWNER="${{ steps.meta.outputs.owner }}"
            bash "/var/tmp/norbot-git-${{ github.run_id }}/Norgoth/scripts/docker/apply-release.sh" \
              production "${{ github.sha }}" "/var/tmp/norbot-git-${{ github.run_id }}"
      - name: Deploy over HTTPS (SSH unreachable)
        if: steps.deploy.outputs.transport == 'ssh' && steps.vds.outcome != 'success'
        uses: ./.github/actions/vds-https-apply
        with:
          url: ${{ secrets.DEPLOY_APPLY_URL }}
          secret: ${{ secrets.DEPLOY_APPLY_SECRET }}
          env_name: production
          sha: ${{ github.sha }}
          owner: ${{ steps.meta.outputs.owner }}
          ghcr_user: ${{ github.actor }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
