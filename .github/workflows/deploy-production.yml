name: Deploy production
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Backup, migrate, deploy, smoke
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image namespace
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build and push images
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cp Norgoth/deploy/docker/.dockerignore.api Norgoth/apps/api/.dockerignore
          cp Norgoth/deploy/docker/.dockerignore.bot Norgoth/apps/bot/.dockerignore
          cp Norgoth/deploy/docker/.dockerignore.web Norgoth/apps/dashboard/.dockerignore
          docker build -f Norgoth/deploy/docker/Dockerfile.api -t "ghcr.io/${OWNER}/norbot-api:${TAG}" Norgoth/apps/api
          docker build -f Norgoth/deploy/docker/Dockerfile.bot -t "ghcr.io/${OWNER}/norbot-bot:${TAG}" Norgoth/apps/bot
          docker build -f Norgoth/deploy/docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_DASHBOARD_URL=https://www.norbot.io \
            --build-arg NORGOTH_API_INTERNAL_URL=http://api:8000 \
            -t "ghcr.io/${OWNER}/norbot-web:${TAG}" Norgoth/apps/dashboard
          docker push "ghcr.io/${OWNER}/norbot-api:${TAG}"
          docker push "ghcr.io/${OWNER}/norbot-bot:${TAG}"
          docker push "ghcr.io/${OWNER}/norbot-web:${TAG}"
      - name: Prepare VDS staging directory
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: mkdir -p "/var/tmp/norbot-git-${{ github.run_id }}"
      - name: Sync compose and scripts to VDS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "Norgoth/deploy,Norgoth/scripts/docker"
          target: "/var/tmp/norbot-git-${{ github.run_id }}"
          rm: false
          overwrite: true
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PULL_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: GHCR_PULL_TOKEN,GHCR_PULL_USER
          script: |
            set -euo pipefail
            trap 'rm -rf "/var/tmp/norbot-git-${{ github.run_id }}"' EXIT
            export NORBOT_IMAGE_TAG="${{ github.sha }}"
            export NORBOT_API_IMAGE="ghcr.io/${{ steps.meta.outputs.owner }}/norbot-api"
            export NORBOT_BOT_IMAGE="ghcr.io/${{ steps.meta.outputs.owner }}/norbot-bot"
            export NORBOT_WEB_IMAGE="ghcr.io/${{ steps.meta.outputs.owner }}/norbot-web"
            rsync -a --delete "/var/tmp/norbot-git-${{ github.run_id }}/Norgoth/deploy/" /opt/norbot/deploy/
            rsync -a "/var/tmp/norbot-git-${{ github.run_id }}/Norgoth/scripts/docker/" /opt/norbot/scripts/
            chmod +x /opt/norbot/scripts/*.sh
            cd /opt/norbot
            /opt/norbot/scripts/ghcr-login.sh
            /opt/norbot/scripts/backup-db.sh production
            docker compose --env-file /opt/norbot/env/production.env -f deploy/compose.yml -f deploy/compose.production.yml pull
            /opt/norbot/scripts/migrate.sh production
            compose_ok=0
            docker compose --env-file /opt/norbot/env/production.env -f deploy/compose.yml -f deploy/compose.production.yml up -d || compose_ok=1
            docker logout ghcr.io >/dev/null 2>&1 || true
            if [[ "${compose_ok}" -ne 0 ]]; then
              /opt/norbot/scripts/dump-compose-logs.sh production || true
              exit 1
            fi
            if ! /opt/norbot/scripts/smoke-check.sh production; then
              /opt/norbot/scripts/dump-compose-logs.sh production || true
              exit 1
            fi
            /opt/norbot/scripts/record-release.sh "${NORBOT_IMAGE_TAG}" production
