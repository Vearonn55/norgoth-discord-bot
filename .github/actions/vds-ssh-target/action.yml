name: Resolve VDS SSH target
description: >
  Validate deploy SSH secrets, pin the host to IPv4 (GitHub-hosted runners
  often stall for the full dial timeout on an unreachable AAAA), then retry
  an SSH handshake so a brief VDS blip does not fail the job.

inputs:
  host:
    required: true
  port:
    required: true
  username:
    required: true
  key:
    required: true
  retries:
    required: false
    default: "5"
  connect_timeout:
    required: false
    default: "20"

outputs:
  ip:
    description: Masked IPv4 address to pass to appleboy ssh/scp
    value: ${{ steps.resolve.outputs.ip }}

runs:
  using: composite
  steps:
    - name: Resolve IPv4
      id: resolve
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_PORT: ${{ inputs.port }}
        DEPLOY_USER: ${{ inputs.username }}
        DEPLOY_SSH_KEY: ${{ inputs.key }}
      run: |
        set -euo pipefail
        missing=0
        [[ -n "${DEPLOY_HOST}" ]] || { echo "::error::DEPLOY_HOST is empty on this GitHub Environment."; missing=1; }
        [[ -n "${DEPLOY_PORT}" ]] || { echo "::error::DEPLOY_PORT is empty; appleboy would dial port 22 and time out."; missing=1; }
        [[ -n "${DEPLOY_USER}" ]] || { echo "::error::DEPLOY_USER is empty."; missing=1; }
        [[ -n "${DEPLOY_SSH_KEY}" ]] || { echo "::error::DEPLOY_SSH_KEY is empty."; missing=1; }
        if [[ "${missing}" -ne 0 ]]; then
          exit 1
        fi
        if ! [[ "${DEPLOY_PORT}" =~ ^[0-9]+$ ]] || (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
          echo "::error::DEPLOY_PORT is not a valid TCP port."
          exit 1
        fi

        ip=""
        if [[ "${DEPLOY_HOST}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
          ip="${DEPLOY_HOST}"
        elif [[ "${DEPLOY_HOST}" == *:* ]]; then
          echo "::error::DEPLOY_HOST is IPv6. Set an IPv4 address or a hostname with an A record."
          exit 1
        else
          ip="$(getent ahostsv4 "${DEPLOY_HOST}" | awk '{ print $1; exit }' || true)"
        fi
        if [[ -z "${ip}" ]]; then
          echo "::error::Could not resolve an IPv4 address for DEPLOY_HOST."
          exit 1
        fi
        echo "::add-mask::${ip}"
        echo "ip=${ip}" >> "${GITHUB_OUTPUT}"
        echo "Resolved VDS SSH target (IPv4, port length=${#DEPLOY_PORT})."

        cf="$(curl -fsSL --max-time 10 https://www.cloudflare.com/ips-v4 2>/dev/null || true)"
        if [[ -n "${cf}" ]]; then
          if ! CF_CIDRS="${cf}" python3 - "${ip}" <<'PY'
        import ipaddress, os, sys
        ip = ipaddress.ip_address(sys.argv[1])
        for line in os.environ.get("CF_CIDRS", "").splitlines():
            line = line.strip()
            if line and ip in ipaddress.ip_network(line):
                raise SystemExit(2)
        PY
          then
            echo "::error::DEPLOY_HOST resolved to a Cloudflare proxy IP. SSH to that address on a non-80/443 port always times out. Set DEPLOY_HOST to the VDS origin IPv4 (grey-cloud DNS, or the address from the provider panel)."
            exit 1
          fi
        fi

    - name: Wait for SSH
      shell: bash
      env:
        VDS_HOST: ${{ steps.resolve.outputs.ip }}
        VDS_PORT: ${{ inputs.port }}
        VDS_USER: ${{ inputs.username }}
        VDS_KEY: ${{ inputs.key }}
        VDS_RETRIES: ${{ inputs.retries }}
        VDS_CONNECT_TIMEOUT: ${{ inputs.connect_timeout }}
      run: |
        set -euo pipefail
        key="$(mktemp)"
        cleanup() { rm -f "${key}"; }
        trap cleanup EXIT
        umask 077
        printf '%s' "${VDS_KEY}" | tr -d '\r' > "${key}"
        printf '\n' >> "${key}"
        chmod 600 "${key}"

        ssh_opts=(
          -i "${key}"
          -p "${VDS_PORT}"
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=publickey
          -o GSSAPIAuthentication=no
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o GlobalKnownHostsFile=/dev/null
          -o ConnectTimeout="${VDS_CONNECT_TIMEOUT}"
        )

        if timeout 8 bash -c "echo >/dev/tcp/${VDS_HOST}/${VDS_PORT}" 2>/dev/null; then
          echo "TCP ${VDS_PORT} is reachable; continuing with SSH handshake."
        else
          echo "TCP ${VDS_PORT} did not accept a connection from this runner (filtered, dropped, or wrong host)."
        fi

        attempts="${VDS_RETRIES}"
        for (( i = 1; i <= attempts; i++ )); do
          if ssh "${ssh_opts[@]}" "${VDS_USER}@${VDS_HOST}" true; then
            echo "SSH handshake succeeded on attempt ${i}/${attempts}."
            exit 0
          fi
          echo "SSH attempt ${i}/${attempts} failed."
          if (( i < attempts )); then
            sleep $(( i * 8 ))
          fi
        done

        echo "::error::Cannot reach the VDS SSH port from this GitHub-hosted runner. Images may already be on GHCR. Typical causes: DEPLOY_HOST is Cloudflare-proxied; provider/ufw firewall allows only your home IP; fail2ban DROP of Azure Actions IPs; sshd not on DEPLOY_PORT. Workflows fall back to HTTPS apply when DEPLOY_APPLY_SECRET is set."
        exit 1
